<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FCFBF9" />
  <script>
    (function() {
      var stored = localStorage.getItem('runway_theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'terminal');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', theme === 'night' ? '#101A24' : '#FCFBF9');
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Static copies for crawlers that never run the bundle; useDocumentMeta overrides these per route. -->
  <meta name="description"
    content="Runway is a real-world, location-based racing game. Design a board over real places, then race friends between waypoints, clearing photo challenges along the way." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Runway" />
  <meta property="og:title" content="Runway — race the real world" />
  <meta property="og:description"
    content="Design a board over real places, then race friends between waypoints, clearing photo challenges along the way." />
  <meta property="og:url" content="https://playrunway.app/" />
  <meta property="og:image" content="https://playrunway.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Runway wordmark beside a wireframe globe crossed by three sunset-coloured routes." />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <title>Runway</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
