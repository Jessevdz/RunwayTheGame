# Honor upstream forwarded scheme when present, falling back to local $scheme.
map $http_x_forwarded_proto $forwarded_scheme {
    default   $scheme;
    ~*^https   https;
    ~*^http    http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Route documentation requests before SPA fallback with dedicated 404 handling.
    location /docs/ {
        try_files $uri $uri/ $uri.html /docs/404.html;
    }

    # Redirect exact /docs path to trailing slash.
    location = /docs {
        return 301 /docs/;
    }

    # Serve SPA static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and WebSocket requests to backend server
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite X-Forwarded-For to prevent client IP spoofing in rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy S3 evidence upload and download requests to MinIO
    location /runway-evidence/ {
        proxy_pass http://minio:9000/runway-evidence/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite X-Forwarded-For to prevent client IP spoofing in rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        client_max_body_size 50M;
    }
}
