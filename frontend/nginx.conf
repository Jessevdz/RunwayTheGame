# Honor upstream forwarded scheme when present, falling back to local $scheme.
map $http_x_forwarded_proto $forwarded_scheme {
    default   $scheme;
    ~*^https   https;
    ~*^http    http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Route documentation requests before SPA fallback with dedicated 404 handling.
    location /docs/ {
        try_files $uri $uri/ $uri.html =404;
        # Without an `=code` parameter nginx keeps the 404 status while serving this page.
        error_page 404 /docs/404.html;
    }

    # Redirect exact /docs path to trailing slash.
    location = /docs {
        return 301 /docs/;
    }

    # Hashed build output
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell names the hashed chunks, so a cached copy of it strands the client on an old build.
    location = /index.html {
        # `always` because this shell is also the body of a 404 response.
        add_header Cache-Control "no-cache" always;
    }

    # Revalidate the worker on every check so a new build is picked up promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Known client-side routes get the shell; the source list is AppRoutes.tsx.
    location ~ ^/(gallery|roadmap|admin|design|races|race|host|join|solo|play)(/|$) {
        try_files $uri /index.html;
    }

    # Serve SPA static files
    location / {
        try_files $uri $uri/ =404;
        # An unknown URL is a real 404, rendered by the shell's NotFound route.
        error_page 404 /index.html;
    }

    # Proxy API and WebSocket requests to backend server
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite X-Forwarded-For to prevent client IP spoofing in rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy S3 evidence upload and download requests to MinIO
    location /runway-evidence/ {
        proxy_pass http://minio:9000/runway-evidence/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite X-Forwarded-For to prevent client IP spoofing in rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        client_max_body_size 50M;
    }
}
