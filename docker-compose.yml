services:
  db:
    image: postgis/postgis:15-3.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RUNWAY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RUNWAY_DB_PASSWORD:-password}
      POSTGRES_DB: ${RUNWAY_DB_NAME:-runway}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${RUNWAY_DB_PORT_BIND:-5433}:5432"
    volumes:
      - runway_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUNWAY_DB_USER:-postgres} -d ${RUNWAY_DB_NAME:-runway}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadminpassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - runway_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadminpassword}
      S3_BUCKET: ${S3_BUCKET:-runway-evidence}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing myminio/$${S3_BUCKET};
      /usr/bin/mc anonymous set download myminio/$${S3_BUCKET};
      echo 'MinIO bucket initialized successfully.';
      exit 0;
      "

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      RUNWAY_DB_HOST: ${RUNWAY_DB_HOST:-db}
      RUNWAY_DB_PORT: ${RUNWAY_DB_PORT:-5432}
      RUNWAY_DB_USER: ${RUNWAY_DB_USER:-postgres}
      RUNWAY_DB_PASSWORD: ${RUNWAY_DB_PASSWORD:-password}
      RUNWAY_DB_NAME: ${RUNWAY_DB_NAME:-runway}
      RUNWAY_DB_SSLMODE: ${RUNWAY_DB_SSLMODE:-disable}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-runway-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadminpassword}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      PORT: ${PORT:-8080}
      RUNWAY_TICK_INTERVAL_SECONDS: ${RUNWAY_TICK_INTERVAL_SECONDS:-10}
      RUNWAY_WORKER_TOKEN: ${RUNWAY_WORKER_TOKEN:?set RUNWAY_WORKER_TOKEN in .env}
      RUNWAY_AI_REFEREE: ${RUNWAY_AI_REFEREE:-${SCALEWAY_API_KEY:+1}${SCW_SECRET_KEY:+1}}
      RUNWAY_ROADMAP_ADMIN_KEY: ${RUNWAY_ROADMAP_ADMIN_KEY:-}
      RUNWAY_ALLOWED_ORIGINS: ${RUNWAY_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      RUNWAY_DB_HOST: ${RUNWAY_DB_HOST:-db}
      RUNWAY_DB_PORT: ${RUNWAY_DB_PORT:-5432}
      RUNWAY_DB_USER: ${RUNWAY_DB_USER:-postgres}
      RUNWAY_DB_PASSWORD: ${RUNWAY_DB_PASSWORD:-password}
      RUNWAY_DB_NAME: ${RUNWAY_DB_NAME:-runway}
      RUNWAY_DB_SSLMODE: ${RUNWAY_DB_SSLMODE:-disable}
      BLOB_DOWNLOAD_BASE_URL: ${BLOB_DOWNLOAD_BASE_URL:-http://minio:9000/runway-evidence}
      RUNWAY_API_BASE_URL: ${RUNWAY_API_BASE_URL:-http://server:8080}
      RUNWAY_WORKER_TOKEN: ${RUNWAY_WORKER_TOKEN:?set RUNWAY_WORKER_TOKEN in .env}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-500}
      SCALEWAY_API_KEY: ${SCALEWAY_API_KEY:-${SCW_SECRET_KEY:-}}
      SCALEWAY_MODEL: ${SCALEWAY_MODEL:-qwen/qwen3.5-397b-a17b:int4}
      SCALEWAY_SECOND_PASS_MODEL: ${SCALEWAY_SECOND_PASS_MODEL:-qwen/qwen3.5-397b-a17b:int4}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      server:
        condition: service_started

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - server

volumes:
  runway_db_data:
  runway_minio_data:
